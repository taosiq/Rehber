services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: rehber
      POSTGRES_PASSWORD: rehber
      POSTGRES_DB: rehber
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rehber"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
